services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabzino
      POSTGRES_USER: sabzino
      POSTGRES_PASSWORD: sabzino
    volumes:
      - sabzino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabzino"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL: "True"
      DATABASE_URL: postgres://sabzino:sabzino@db:5432/sabzino
    volumes:
      - sabzino_media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sabzino_pgdata:
  sabzino_media:
